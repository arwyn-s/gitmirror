[project]
name = "repotrack"
version = "0.1.0"
description = "Mirror a YAML list of git repo branches into a local directory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "rich>=13",
]

[project.scripts]
repotrack = "repotrack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repotrack"]
